apply plugin: 'com.android.application'

// Chave de upload: fica fora do git. Vale a pasta do usuário (~/.wordquest-signing) ou, se não houver,
// android/keystore.properties (ignorado pelo git). `storeFile` relativo conta a partir da pasta do arquivo.
def keystoreProps = new Properties()
def keystoreFile = [
    new File(System.getProperty('user.home'), '.wordquest-signing/keystore.properties'),
    rootProject.file('keystore.properties'),
].find { it.exists() }
if (keystoreFile) { keystoreFile.withInputStream { keystoreProps.load(it) } }
def keystoreStore = keystoreProps['storeFile'] ? new File(keystoreProps['storeFile'].toString()) : null
if (keystoreStore && !keystoreStore.isAbsolute()) {
    keystoreStore = new File(keystoreFile.parentFile, keystoreProps['storeFile'].toString())
}

android {
    namespace = "br.com.wordquest.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.wordquest.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 44
        versionName "5.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile keystoreStore
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        // Build de teste: outro id de pacote, para instalar ao lado da versão da loja sem mexer nela.
        debug {
            applicationIdSuffix ".teste"
            // Testes não entram nas métricas: Analytics e Crashlytics desligados no build de teste.
            manifestPlaceholders += [telemetryEnabled: "false"]
        }
        release {
            manifestPlaceholders += [telemetryEnabled: "true"]
            if (keystoreProps['storeFile']) { signingConfig signingConfigs.release }
            // R8: remove código e recursos sem uso e otimiza o que sobra (app menor e mais leve).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-games-v2:22.1.0"
    // Avaliação dentro do app (janela de estrelas do Google Play).
    implementation "com.google.android.play:review:2.0.2"
    // Convite: o código da sala que veio no link da Play Store chega ao app recém-instalado.
    implementation "com.android.installreferrer:installreferrer:2.2"
    // Firebase: medição de uso (Analytics) e relatórios de falha (Crashlytics). As versões vêm do BoM.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-crashlytics"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, Analytics e Crashlytics ficam desligados neste build")
}
