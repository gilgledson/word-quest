name: Atualização ao vivo

# Publica uma versão nova do app (código, telas e arte) no Firebase Hosting, sem passar pela
# Play Store: quem tem a versão da loja indicada no build.gradle recebe na próxima abertura.
# Só roda à mão (Actions > Atualização ao vivo > Run workflow) e nunca em pull request, para que
# o segredo do Firebase não fique ao alcance de código vindo de fora.
on:
  workflow_dispatch:

# Uma publicação por vez (a segunda espera a primeira terminar).
concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Ambiente "production": em Settings > Environments dá para exigir aprovação antes de publicar.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # As mesmas checagens do CI: se alguma falhar, nada é publicado.
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npx tsc -b
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (360×800)
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
      - name: Restaurar a credencial do Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT (chave JSON da conta de serviço)."
            exit 1
          fi
          dir="$RUNNER_TEMP/firebase"
          mkdir -p "$dir"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$dir/service-account.json"
          chmod 600 "$dir/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$dir/service-account.json" >> "$GITHUB_ENV"
      - name: Gerar o pacote e publicar
        run: node scripts/publish-app.mjs --deploy
      - name: Remover a credencial do runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/firebase"
      # Versão web (jogar.wordquest.com.br): o mesmo código, no build web (PWA).
      - name: Build da versão web
        run: npx vite build
      - name: Restaurar a chave do servidor
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/site_deploy ~/.ssh/known_hosts
      - name: Publicar a versão web
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
        # Sem --delete: quem está com o jogo aberto ainda pode pedir arquivos da versão anterior.
        # O index.html e o service worker vão por último, depois dos arquivos que eles citam.
        run: |
          ssh_cmd="ssh -i $HOME/.ssh/site_deploy -o IdentitiesOnly=yes"
          rsync -rlz --chmod=D755,F644 -e "$ssh_cmd" \
            --exclude index.html --exclude sw.js \
            dist/ "wqdeploy@${SITE_HOST}:/var/www/wordquest-jogo/"
          rsync -rlz --chmod=D755,F644 -e "$ssh_cmd" \
            dist/index.html dist/sw.js "wqdeploy@${SITE_HOST}:/var/www/wordquest-jogo/"
      - name: Remover a chave do servidor
        if: always()
        run: rm -f ~/.ssh/site_deploy
      - name: Versão publicada
        run: |
          curl -s https://wordquest-online.web.app/app/latest.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(`Em vigor: ${r.version} (loja ${r.natives.join(", ")})`)})' \
            | tee -a "$GITHUB_STEP_SUMMARY"
